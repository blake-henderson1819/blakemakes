<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Scanner</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Scan">
<meta name="theme-color" content="#fbf8f3"><link rel="stylesheet" href="style.css"></head><body><main>
<h1>Page Scanner</h1><p class="sub">Record yourself flipping through pages. Hold each page still for about a second. Everything stays on your phone.</p>
<label class="btn primary" style="width:100%">Record or choose video<input id="file" type="file" accept="video/*" capture="environment"></label>
<div id="prog" class="hide"><div id="status">Working…</div><progress id="bar" max="1" value="0"></progress></div>
<div id="tools" class="hide">
 <div class="seg" id="mode"><button data-m="color">Color</button><button data-m="enhanced" class="on">Enhanced</button><button data-m="bw">B&amp;W</button></div>
 <div class="row"><button class="btn primary" id="pdf">Export PDF</button><button class="btn" id="shareAll">Share all</button></div>
 <div class="row"><button class="btn" id="addBtn">+ Add frame</button></div>
 <div id="scrub"><video id="sv" playsinline muted></video><input id="sr" type="range" min="0" max="1" step="0.01" value="0">
  <div class="row"><button class="btn primary" id="grab">Add this frame</button><button class="btn" id="scrubClose">Done</button></div></div>
 <div id="count" class="sub"></div><div class="grid" id="grid"></div>
</div>
<video id="v" playsinline muted preload="auto" class="hide"></video>
<div id="viewer"><img id="vimg" alt=""><div class="row"><button class="btn" id="vshare">Save / Share</button><button class="btn primary" id="vclose">Close</button></div></div>
<p><small>Tip: tap Share → “Save Image” to put pages in Photos. Add to Home Screen from Safari’s share menu.</small></p>
</main><script src="core.js"></script><script src="vendor/jspdf.umd.min.js"></script><script src="app.js"></script></body></html>
